# DEIM-D-FINE-M / OGSOD-1.0 SAR-only 120-epoch baseline
# Medium model reference for comparison with S + modules.
__include__: ['./deim_hgnetv2_m_coco.yml']

output_dir: /home/zxy/sar/experiments/deim_dfine_m_ogsod_baseline_120e/seed0
use_ema: True
use_amp: True

num_classes: 3
remap_mscoco_category: False

HGNetv2:
  pretrained: False

# OGSOD adaptation: 120 epochs matching S baseline for fair comparison
epoches: 120
warmup_iter: 1000
flat_epoch: 60
no_aug_epoch: 8
checkpoint_freq: 10
print_freq: 50

train_dataloader:
  total_batch_size: 32
  num_workers: 4
  dataset:
    img_folder: /data2/zxy/sar/datasets/OGSOD-1.0/sar
    ann_file: /data2/zxy/sar/datasets/OGSOD-1.0/sar/RTDETR_COCO/train.json
    transforms:
      policy:
        epoch: [4, 60, 112]
  collate_fn:
    mixup_epochs: [4, 60]
    stop_epoch: 112

val_dataloader:
  total_batch_size: 16
  num_workers: 4
  dataset:
    img_folder: /data2/zxy/sar/datasets/OGSOD-1.0/sar
    ann_file: /data2/zxy/sar/datasets/OGSOD-1.0/sar/RTDETR_COCO/val.json

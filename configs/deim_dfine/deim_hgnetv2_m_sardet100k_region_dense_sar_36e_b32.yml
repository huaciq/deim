# RegionDense v2: complete-source FIFO packing with background-compatible donors.
# Only the training image construction changes relative to E008/E009.
__include__: ['./deim_hgnetv2_m_sardet100k_no_dense_o2o_36e_b32.yml']

experiment_protocol_document: docs/sardet100k_region_dense_sar_experiment.md
experiment_baseline_revision: b75a868
output_dir: /root/zxy/experiments/deim_m_sardet100k_region_dense_sar_36e_b32/seed0

train_dataloader:
  dataset:
    type: RegionDenseSARCocoDetection
    plan_dir: /root/zxy/experiments/region_banks/sardet100k_train_region_dense_sar_v2_seed0_b32
    plan_settings:
      size: 640
      context_margin: 1.0
      epochs: [4, 20]
      probability: 0.5
      queue_capacity: 64
      nearest_candidates: 4
      max_targets: 300
      seed: 0
      background_mask_margin: 2.0
      min_background_pixels: 256
    transforms:
      mosaic_prob: 0.
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        ops: ['RandomPhotometricDistort']
  collate_fn:
    mixup_prob: 0.

__include__: ['./deim_hgnetv2_s_ogsod_120e_1gpu_noaug.yml']

# SBR (Simple Background Rejection) Configuration
#
# Addresses: 63.4% background false positives from error analysis
# Expected: reduce background FPs by 40-50%, +0.9~1.2 AP
# Precision should improve from 83.6% to 88%

DFINETransformer:
  use_sbr: True
  sbr_neg_iou_threshold: 0.3  # IoU < 0.3 is considered background
  sbr_suppression_mode: 'multiplicative'  # 'multiplicative' or 'additive'
  # --- v1 reproduction settings (frozen 2026-10-22) ---
  # The code defaults are now the v2 behaviour (plain IoU labels, inference-only
  # suppression). These four keys pin this config to the exact v1 semantics that
  # produced AP 58.6, so the historical number stays reproducible.
  sbr_bg_label_metric: 'giou'
  sbr_apply_in_train: True
  sbr_suppression_strength: 0.8
  sbr_ignore_iou_threshold: 0.5

# Add SBR loss to criterion
DEIMCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_mal: 1
    loss_sbr: 0.5  # SBR loss weight

# Reduce batch size to avoid OOM (SBR adds ~10% memory overhead)
output_dir: /home/zxy/sar/experiments/deim_dfine_s_ogsod_120e_1gpu_sbr/seed0

train_dataloader:
  total_batch_size: 28  # Unified protocol (2026-10-22)

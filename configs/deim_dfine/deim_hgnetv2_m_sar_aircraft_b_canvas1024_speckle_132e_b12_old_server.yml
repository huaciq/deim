# Scheme B main protocol B-v1 + speckle resampling; differs from the B-v1 baseline only by SpeckleResample.
# Parameters fixed on trainval images by tools/check_speckle_resampling.py (docs/sar_protocol_b.md section 1.3).
__include__: ['./deim_hgnetv2_m_sar_aircraft_b_canvas1024_132e_b12_old_server.yml']

output_dir: /home/zxy/sar/experiments/deim_m_sar_aircraft_b_canvas1024_speckle_132e_b12/seed0

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: RandomHorizontalFlip}
        - {type: SpeckleResample, p: 0.5, window: 7, noise_sigma: 0.8, structure_gain: 2.0, bright_ratio: 3.0}  # on stored pixels, before padding and resizing
        - {type: PadToCanvas, size: 1500, fill: 0}
        - {type: Resize, size: [1024, 1024]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 70, 120]  # SpeckleResample runs in epochs 4-119; the last 12 epochs see stored images
        ops: ['Mosaic', 'RandomPhotometricDistort', 'SpeckleResample']

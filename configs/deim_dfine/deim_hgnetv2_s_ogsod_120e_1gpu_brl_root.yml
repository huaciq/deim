__include__:
  - './deim_hgnetv2_s_ogsod_120e_1gpu_noaug.yml'
  - './paths_root.yml'

# BRL (Boundary Refinement Loss) Configuration
#
# Addresses: 36.6% localization errors (IoU < 0.5)
# Expected: improve AP75 by 1.5~2.0, overall AP +0.8~1.2
#
# Core innovation:
# - Explicit IoU quality prediction
# - IoU-guided box refinement
# - Focus on boundary accuracy

DFINETransformer:
  use_brl: True
  brl_use_boundary_attention: False  # Simplified version without BCM dependency

DEIMCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_mal: 1
    loss_iou_pred: 2.0  # BRL IoU prediction loss

# No batch size reduction needed (BRL is lightweight)
train_dataloader:
  total_batch_size: 32

# DEIM-D-FINE-S / OGSOD-1.0 SAR-only baseline
# Place: /home/zxy/sar/repos/deim/configs/deim_dfine/deim_hgnetv2_s_ogsod.yml
# Based on DEIM official configs/deim_dfine/deim_hgnetv2_s_coco.yml
# Run tools/dataset/prepare_ogsod_baseline.py before training.
__include__: ['./deim_hgnetv2_s_coco.yml']

output_dir: /home/zxy/sar/experiments/deim_dfine_s_ogsod_baseline/seed0
use_ema: True
use_amp: True

# Native OGSOD IDs may be 1,2,3; preparation generates zero-based IDs 0,1,2.
num_classes: 3
remap_mscoco_category: False

# Launch with -t /home/zxy/sar/pretrain/deim/deim_dfine_hgnetv2_s_coco_120e.pth.
# Compatible detector weights are loaded; mismatched classification tensors are skipped.
HGNetv2:
  pretrained: False

# OGSOD adaptation plan, not the 132-epoch COCO reproduction.
epoches: 80
warmup_iter: 1000
flat_epoch: 40
no_aug_epoch: 8
checkpoint_freq: 10
print_freq: 50

train_dataloader:
  # GLOBAL batch: 32 across 2 GPUs = 16 per GPU (try 16 global if CUDA OOM).
  total_batch_size: 32
  num_workers: 4
  dataset:
    img_folder: /data2/zxy/sar/datasets/OGSOD-1.0/sar/images/train
    ann_file: /data2/zxy/sar/datasets/OGSOD-1.0/sar/RTDETR_COCO/train.json
    transforms:
      policy:
        epoch: [4, 40, 72]
  collate_fn:
    mixup_epochs: [4, 40]
    stop_epoch: 72

val_dataloader:
  total_batch_size: 16
  num_workers: 4
  dataset:
    img_folder: /data2/zxy/sar/datasets/OGSOD-1.0/sar/images/test
    ann_file: /data2/zxy/sar/datasets/OGSOD-1.0/sar/RTDETR_COCO/val.json
